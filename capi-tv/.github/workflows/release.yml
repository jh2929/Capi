name: Build APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute version
        id: version
        shell: bash
        run: |
          VER=$(grep -oP '(?<!//\s)versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          echo "Detected versionName: $VER"

      - name: Generate signing keystore
        shell: bash
        run: |
          mkdir -p app/keystore
          keytool -genkeypair -v \
            -keystore app/keystore/release.keystore \
            -alias capi \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass capi-ci -keypass capi-ci \
            -dname "CN=Capi CI, OU=Capi, O=Capi, L=, ST=, C=US"

      - name: Build universal release APK
        env:
          STORE_PASSWORD: capi-ci
          KEY_ALIAS: capi
          KEY_PASSWORD: capi-ci
        run: ./gradlew :app:assembleUniversalRelease --no-daemon

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', env.VERSION) }}
          name: Capi TV ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', env.VERSION) }}
          generate_release_notes: false
          files: app/build/outputs/apk/universal/release/*.apk