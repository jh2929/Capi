name: Android CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048M -XX:MaxMetaspaceSize=768M -Dkotlin.daemon.jvmargs=-Xmx2560M"

jobs:
  build-debug:
    name: Build debug APKs
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') == false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build universal debug APK
        run: ./gradlew :app:assembleUniversalDebug --no-parallel --console=plain

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: capi-universal-debug
          path: app/build/outputs/apk/universal/debug/*.apk

  release:
    name: Build release APKs and publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        run: |
          ./gradlew :app:assembleUniversalDebug :app:assembleArm64Debug --no-parallel --console=plain

      - name: Stage APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/universal/debug/app-universal-debug.apk dist/capi-universal-debug.apk
          cp app/build/outputs/apk/arm64/debug/app-arm64-debug.apk dist/capi-arm64-debug.apk
          ls -la dist

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true